<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="View your shopping cart and proceed to checkout.">
  <title>Your Cart — Homeokit Homoeopathy</title>
  <link rel="icon" href="images/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="cart">
  <div id="site-header"></div>

  <main>
    <section class="page-hero" style="padding-bottom:26px">
      <div class="container">
        <nav class="breadcrumb" aria-label="Breadcrumb">
          <a href="index.html">Home</a><span class="sep">›</span><span class="current">Cart</span>
        </nav>
        <h1>Shopping Cart</h1>
        <p>Review your items before checkout.</p>
      </div>
    </section>

    <section class="section" style="padding-top:20px">
      <div class="container">
        <div class="empty-state" id="cart-empty" hidden>
          <div class="icon">🛒</div>
          <h2>Your cart is empty</h2>
          <p>Browse our range of natural homoeopathic remedies and add something to your cart.</p>
          <a href="shop.html" class="btn btn-primary">Start Shopping</a>
        </div>

        <div class="cart-layout" id="cart-content" hidden>
          <div>
            <div class="cart-list" id="cart-items"></div>
            <p class="small muted" style="margin-top:16px">Prices include all taxes. Shipping is free on orders above ₹499.</p>
          </div>
          <aside class="summary-card" id="cart-summary"></aside>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="js/cart.js"></script>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
