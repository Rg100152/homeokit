<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Browse and filter homoeopathic medicines by category, ailment and price at Homeokit Homoeopathy.">
  <title>Shop All Products — Homeokit Homoeopathy</title>
  <link rel="icon" href="images/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/shop.css">
</head>
<body data-page="shop">
  <div id="site-header"></div>

  <main>
    <section class="page-hero">
      <div class="container">
        <nav class="breadcrumb" aria-label="Breadcrumb">
          <a href="index.html">Home</a><span class="sep">›</span><span class="current">Shop</span>
        </nav>
        <h1>Shop Homoeopathic Medicines</h1>
        <p>Explore our complete catalogue. Filter by category, ailment and price to find exactly what you need.</p>
        <form class="header-search" id="shop-search" role="search" style="max-width:640px;margin:18px 0 0">
          <span aria-hidden="true">🔎</span>
          <input type="search" id="shop-search-input" placeholder="Search by medicine or ailment (e.g. cough, skin, stress)" aria-label="Search products">
          <button type="submit" class="btn btn-primary btn-sm">Search</button>
        </form>
      </div>
    </section>

    <section class="section" style="padding-top:26px">
      <div class="container shop-layout">
        <!-- Desktop sidebar -->
        <aside class="filter-sidebar filter-host" aria-label="Product filters"></aside>

        <!-- Results -->
        <div class="shop-main">
          <div class="shop-toolbar">
            <p class="result-count" id="result-count">Loading products…</p>
            <div class="toolbar-right">
              <button type="button" class="btn btn-outline btn-sm filter-toggle" id="filter-toggle">⚙ Filters</button>
              <span id="sort-host"></span>
            </div>
          </div>
          <div class="active-filters" id="active-filters"></div>
          <div class="product-grid" id="product-grid"></div>
          <nav class="pagination" id="pagination" aria-label="Product pagination"></nav>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <!-- Mobile filter drawer -->
  <div class="drawer-backdrop" id="drawer-backdrop"></div>
  <aside class="filter-drawer" id="filter-drawer" aria-label="Product filters">
    <div class="drawer-head"><h3>Filters</h3><button type="button" class="drawer-close" id="drawer-close" aria-label="Close filters">✕</button></div>
    <div class="drawer-body filter-host"></div>
    <div class="drawer-footer"><button type="button" class="btn btn-primary btn-block" id="drawer-apply">Show Products</button></div>
  </aside>

  <script src="js/cart.js"></script>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script src="js/products.js"></script>
</body>
</html>
